<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Imposter</title>
<style>
  :root {
    --bg: #14151c;
    --card: #1f2130;
    --card-2: #2a2d42;
    --text: #f2f3f8;
    --muted: #8d91a8;
    --accent: #6c7bff;
    --danger: #ff5c6c;
    --ok: #3ecf8e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
    padding: 24px 16px;
  }
  .app { width: 100%; max-width: 440px; }
  h1 { text-align: center; margin: 0 0 4px; font-size: 2rem; letter-spacing: 1px; }
  .sub { text-align: center; color: var(--muted); margin: 0 0 24px; }
  .screen { display: none; }
  .screen.active { display: block; }
  .panel {
    background: var(--card);
    border-radius: 16px;
    padding: 18px;
    margin-bottom: 16px;
  }
  .panel h2 { margin: 0 0 12px; font-size: 1.05rem; }
  .row { display: flex; gap: 8px; }
  input[type="text"], select {
    flex: 1;
    min-width: 0;
    padding: 12px 14px;
    border-radius: 10px;
    border: 2px solid transparent;
    background: var(--card-2);
    color: var(--text);
    font-size: 1rem;
  }
  select { width: 100%; }
  input[type="text"]:focus, select:focus { outline: none; border-color: var(--accent); }
  button {
    border: none;
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 1rem;
    font-weight: 600;
    color: #fff;
    background: var(--accent);
    cursor: pointer;
  }
  button:active { transform: scale(0.98); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button.secondary { background: var(--card-2); }
  button.danger { background: var(--danger); }
  button.big { width: 100%; padding: 16px; font-size: 1.1rem; }
  .stack { display: flex; flex-direction: column; gap: 10px; }
  ul.players { list-style: none; margin: 12px 0 0; padding: 0; }
  ul.players li {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--card-2);
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 8px;
  }
  ul.players li span { word-break: break-word; }
  ul.players li button { padding: 6px 10px; background: transparent; color: var(--danger); font-size: 1.1rem; }
  .empty { color: var(--muted); margin: 12px 0 0; font-size: 0.95rem; }
  .field { margin-bottom: 14px; }
  .field label { display: block; color: var(--muted); font-size: 0.9rem; margin-bottom: 6px; }
  .error { color: var(--danger); min-height: 1.3em; margin: 0 0 8px; text-align: center; font-size: 0.95rem; }

  /* Aufdecken */
  .counter { text-align: center; color: var(--muted); margin-bottom: 8px; }
  .player-name { text-align: center; font-size: 1.8rem; font-weight: 700; margin: 0 0 18px; word-break: break-word; }
  .word-box {
    position: relative;
    background: var(--card);
    border-radius: 16px;
    min-height: 160px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
    margin-bottom: 18px;
    overflow: hidden;
  }
  .word-text { font-size: 2.2rem; font-weight: 800; word-break: break-word; }
  .word-text.imposter { color: var(--danger); }
  .cover {
    position: absolute;
    inset: 0;
    background: #3a3d52;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 1.1rem;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .cover.hidden { display: none; }

  /* Spiel läuft */
  .playing { text-align: center; padding: 30px 18px; }
  .playing h2 { font-size: 1.6rem; margin-bottom: 8px; }
  .playing p { color: var(--muted); margin: 0; }
  .result { text-align: center; margin-bottom: 16px; }
  .result .label { color: var(--muted); margin-bottom: 8px; }
  .result .names { font-size: 1.8rem; font-weight: 800; color: var(--danger); word-break: break-word; }
  .result .word { margin-top: 14px; color: var(--muted); }
  .result .word b { color: var(--ok); }
</style>
</head>
<body>
<div class="app">
  <h1>IMPOSTER</h1>
  <p class="sub">Gib das Handy weiter und finde den Imposter.</p>

  <!-- EINSTELLUNGEN -->
  <section id="screen-setup" class="screen active">
    <div class="panel">
      <h2>Spieler</h2>
      <div class="row">
        <input type="text" id="name-input" placeholder="Name eingeben" maxlength="20" autocomplete="off">
        <button type="button" id="add-btn">Hinzufügen</button>
      </div>
      <ul id="player-list" class="players"></ul>
      <p id="empty-msg" class="empty">Noch keine Spieler. Füge mindestens 3 hinzu.</p>
    </div>

    <div class="panel">
      <h2>Optionen</h2>
      <div class="field">
        <label for="imposter-count">Anzahl der Imposter</label>
        <select id="imposter-count">
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
        </select>
      </div>
      <div class="field" style="margin-bottom:0">
        <label for="category">Kategorie</label>
        <select id="category"></select>
      </div>
    </div>

    <p id="setup-error" class="error"></p>
    <button id="start-btn" class="big">Spiel starten</button>
  </section>

  <!-- AUFDECKEN -->
  <section id="screen-reveal" class="screen">
    <div class="counter" id="reveal-counter"></div>
    <div class="player-name" id="reveal-name"></div>
    <div class="word-box">
      <div class="word-text" id="reveal-word"></div>
      <div class="cover" id="reveal-cover">Verdeckt</div>
    </div>
    <div class="stack">
      <button id="open-btn" class="big">Öffnen</button>
      <button id="hide-btn" class="big secondary" style="display:none">Verstecken</button>
      <button id="next-btn" class="big" style="display:none">Nächster Spieler</button>
    </div>
  </section>

  <!-- SPIEL LÄUFT -->
  <section id="screen-playing" class="screen">
    <div class="panel playing" id="playing-panel">
      <h2>Das Spiel läuft</h2>
      <p>Redet miteinander und findet heraus, wer der Imposter ist!</p>
    </div>
    <div id="result" class="panel result" style="display:none">
      <div class="label" id="result-label"></div>
      <div class="names" id="result-names"></div>
      <div class="word">Das Wort war: <b id="result-word"></b></div>
    </div>
    <div class="stack">
      <button id="show-btn" class="big danger">Zeige, wer der Imposter ist</button>
      <button id="again-btn" class="big" style="display:none">Neue Runde (gleiche Spieler)</button>
      <button id="end-btn" class="big secondary">Spiel beenden</button>
    </div>
  </section>
</div>

<script>
  // ---- Wörter nach Kategorien (hier kannst du jederzeit Wörter ergänzen) ----
  const CATEGORIES = {
    "Trends": ["Labubu", "Dubai-Schokolade", "Matcha", "Padel", "Pilates", "Heißluftfritteuse", "Thrifting", "Skincare", "Stanley-Becher", "Bubble Tea", "Sneaker", "Podcast", "Cold Plunge", "Duolingo", "Oversize-Hoodie", "Pickleball", "Reels", "Smartwatch", "Wordle", "Tanghulu"],
    "Spicy": ["Kuss", "Flirten", "Knutschfleck", "Massage", "Sauna", "Bikini", "Candle-Light-Dinner", "Tinder", "Lippenstift", "Seitensprung", "Kuscheln", "Dessous", "Ex", "One-Night-Stand", "Valentinstag", "Hotelzimmer", "Schmetterlinge im Bauch", "Blind Date", "Schlafzimmer", "Eifersucht"],
    "Marken": ["Nike", "Adidas", "Apple", "IKEA", "Coca-Cola", "McDonald's", "Lidl", "Aldi", "Netflix", "Spotify", "Zara", "Samsung", "BMW", "Haribo", "Red Bull", "Nutella", "Rewe", "Puma", "Lego", "PlayStation"],
    "Filme und Serien": ["Harry Potter", "Titanic", "Der Herr der Ringe", "Star Wars", "Stranger Things", "Squid Game", "Breaking Bad", "Game of Thrones", "Fack ju Göhte", "Dark", "Shrek", "Findet Nemo", "Der Pate", "Friends", "Barbie", "Matrix", "Jurassic Park", "Wednesday", "Haus des Geldes", "Avatar"],
    "Jugendsprache": ["Digga", "Cringe", "Wallah", "Lost", "Safe", "Ehrenmann", "Slay", "Aura", "Läuft bei dir", "Goofy", "Sus", "Rizz", "Mid", "Talahon", "Sigma", "Yolo", "Bro", "Hater", "Vibe", "Flexen"],
    "Gen Z": ["TikTok", "Snapchat", "BeReal", "Streaks", "Skibidi", "Girl Dinner", "Brainrot", "Doomscrollen", "Ghosting", "Situationship", "Main Character", "Red Flag", "Green Flag", "Quiet Quitting", "AirPods", "Crocs", "Shein", "FOMO", "Digital Detox", "Close Friends"],
    "Anime": ["Naruto", "One Piece", "Dragon Ball", "Attack on Titan", "Death Note", "Pokémon", "Demon Slayer", "My Hero Academia", "Sailor Moon", "Das wandelnde Schloss", "Totoro", "Jujutsu Kaisen", "Fullmetal Alchemist", "Bleach", "Tokyo Ghoul", "One Punch Man", "Detektiv Conan", "Hunter x Hunter", "Goku", "Ruffy"],
    "Tiere und Natur": ["Löwe", "Pinguin", "Delfin", "Wald", "Vulkan", "Wasserfall", "Regenbogen", "Gewitter", "Korallenriff", "Wüste", "Eule", "Kolibri", "Faultier", "Gebirge", "Nordlicht", "Dschungel", "Oktopus", "Biene", "Gletscher", "Sonnenblume"],
    "Stars und Celebrities": ["Taylor Swift", "Cristiano Ronaldo", "Lionel Messi", "Elon Musk", "Rihanna", "Beyoncé", "Kim Kardashian", "Billie Eilish", "Drake", "Tom Cruise", "Leonardo DiCaprio", "Helene Fischer", "Till Lindemann", "Heidi Klum", "Joko Winterscheidt", "Cardi B", "MrBeast", "Lena Meyer-Landrut", "Dwayne Johnson", "Zendaya"],
    // Die Seifenblase ist noch leer – trag hier später deine eigenen Wörter ein, z. B. ["Wort1", "Wort2"]
    "Seifenblase": [],
    "Musik": ["Gitarre", "Klavier", "Schlagzeug", "Konzert", "Mikrofon", "Kopfhörer", "DJ", "Festival", "Karaoke", "Chor", "Refrain", "Vinyl", "Rap", "Techno", "Geige", "Playlist", "Bass", "Orchester", "Tonleiter", "Album"],
    "Videospiele": ["Minecraft", "Fortnite", "FIFA", "Super Mario", "Zelda", "GTA", "Among Us", "Roblox", "Tetris", "Pac-Man", "League of Legends", "Call of Duty", "Pokémon", "Counter-Strike", "Die Sims", "Valorant", "Fallout", "Animal Crossing", "Skyrim", "Rocket League"],
    "Memes": ["Doge", "Grumpy Cat", "Rickroll", "Pepe", "Trollface", "Distracted Boyfriend", "Nyan Cat", "Harold", "Karen", "Gigachad", "Stonks", "Bonk", "Baby Yoda", "Ohio", "Sigma Male", "Skibidi Toilet", "Cheems", "Huh-Katze", "Moo Deng", "Chad"],
    "Anatomie": ["Herz", "Lunge", "Leber", "Niere", "Gehirn", "Magen", "Wirbelsäule", "Schädel", "Rippen", "Zwerchfell", "Darm", "Blase", "Oberschenkel", "Ellenbogen", "Kniescheibe", "Bauchnabel", "Zunge", "Daumen", "Fußsohle", "Gaumen"],
    "Historische Figuren": ["Napoleon", "Kleopatra", "Albert Einstein", "Julius Caesar", "Leonardo da Vinci", "Martin Luther", "Karl der Große", "Marie Curie", "Gandhi", "Abraham Lincoln", "Dschingis Khan", "Mozart", "Beethoven", "Goethe", "Königin Victoria", "Sisi", "Friedrich der Große", "Christoph Kolumbus", "Alexander der Große", "Nelson Mandela"],
    "Getränke": ["Cola", "Apfelschorle", "Club-Mate", "Kaffee", "Tee", "Bier", "Weißwein", "Sekt", "Mojito", "Limonade", "Milchshake", "Smoothie", "Energydrink", "Wasser", "Aperol Spritz", "Eistee", "Glühwein", "Orangensaft", "Kakao", "Radler"],
    "Haushaltsgeräte": ["Staubsauger", "Waschmaschine", "Toaster", "Mikrowelle", "Kühlschrank", "Geschirrspüler", "Wasserkocher", "Bügeleisen", "Föhn", "Mixer", "Kaffeemaschine", "Trockner", "Backofen", "Herd", "Dunstabzugshaube", "Saugroboter", "Heißluftfritteuse", "Rasierer", "Ventilator", "Gefrierschrank"]
  };
  const RANDOM = "Zufällig (alle Kategorien)";

  // ---- Zustand ----
  let players = [];
  let state = null; // { word, imposters:Set, index }

  // ---- Elemente ----
  const $ = id => document.getElementById(id);
  const screens = { setup: $("screen-setup"), reveal: $("screen-reveal"), playing: $("screen-playing") };

  function show(name) {
    Object.values(screens).forEach(s => s.classList.remove("active"));
    screens[name].classList.add("active");
    window.scrollTo(0, 0);
  }

  // ---- Einstellungen ----
  function fillCategories() {
    const sel = $("category");
    sel.innerHTML = "";
    [RANDOM, ...Object.keys(CATEGORIES)].forEach(c => {
      const o = document.createElement("option");
      o.value = c;
      o.textContent = c;
      sel.appendChild(o);
    });
  }

  function renderPlayers() {
    const list = $("player-list");
    list.innerHTML = "";
    players.forEach((name, i) => {
      const li = document.createElement("li");
      const span = document.createElement("span");
      span.textContent = name;
      const btn = document.createElement("button");
      btn.type = "button";
      btn.textContent = "✕";
      btn.setAttribute("aria-label", name + " entfernen");
      btn.onclick = () => { players.splice(i, 1); renderPlayers(); };
      li.append(span, btn);
      list.appendChild(li);
    });
    $("empty-msg").style.display = players.length ? "none" : "block";
  }

  function addPlayer() {
    const input = $("name-input");
    const name = input.value.trim();
    if (!name) return;
    if (players.some(p => p.toLowerCase() === name.toLowerCase())) {
      $("setup-error").textContent = "Dieser Name ist schon vergeben.";
      return;
    }
    $("setup-error").textContent = "";
    players.push(name);
    input.value = "";
    input.focus();
    renderPlayers();
  }
  $("add-btn").addEventListener("click", addPlayer);
  $("name-input").addEventListener("keydown", e => {
    if (e.key === "Enter") { e.preventDefault(); addPlayer(); }
  });

  // ---- Spiel starten ----
  function pickWord() {
    const cat = $("category").value;
    const pool = cat === RANDOM ? Object.values(CATEGORIES).flat() : CATEGORIES[cat];
    return pool[Math.floor(Math.random() * pool.length)];
  }

  function startGame() {
    const err = $("setup-error");
    if (players.length < 3) { err.textContent = "Du brauchst mindestens 3 Spieler."; return; }
    const count = parseInt($("imposter-count").value, 10);
    if (count >= players.length) { err.textContent = "Es müssen weniger Imposter als Spieler sein."; return; }
    const cat = $("category").value;
    if (cat !== RANDOM && CATEGORIES[cat].length === 0) {
      err.textContent = "Die Kategorie „" + cat + "“ ist noch leer. Füge erst Wörter hinzu.";
      return;
    }
    err.textContent = "";

    // Imposter zufällig auswählen
    const idx = players.map((_, i) => i);
    for (let i = idx.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [idx[i], idx[j]] = [idx[j], idx[i]];
    }
    const order = players.map((_, i) => i);
    for (let i = order.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
    state = { word: pickWord(), imposters: new Set(idx.slice(0, count)), index: 0, order: order };
    showPlayerTurn();
    show("reveal");
  }
  $("start-btn").onclick = startGame;

  // ---- Wort aufdecken ----
  function showPlayerTurn() {
    const i = state.index;
    const p = state.order[i];
    $("reveal-counter").textContent = "Spieler " + (i + 1) + " von " + players.length;
    $("reveal-name").textContent = players[p];
    const w = $("reveal-word");
    if (state.imposters.has(p)) {
      w.textContent = "IMPOSTER";
      w.classList.add("imposter");
    } else {
      w.textContent = state.word;
      w.classList.remove("imposter");
    }
    $("reveal-cover").classList.remove("hidden");
    $("open-btn").style.display = "";
    $("hide-btn").style.display = "none";
    $("next-btn").style.display = "none";
  }

  $("open-btn").onclick = () => {
    $("reveal-cover").classList.add("hidden");
    $("open-btn").style.display = "none";
    $("hide-btn").style.display = "";
  };

  $("hide-btn").onclick = () => {
    $("reveal-cover").classList.remove("hidden");
    $("hide-btn").style.display = "none";
    const last = state.index === players.length - 1;
    $("next-btn").textContent = last ? "Spiel beginnen" : "Nächster Spieler";
    $("next-btn").style.display = "";
  };

  $("next-btn").onclick = () => {
    if (state.index < players.length - 1) {
      state.index++;
      showPlayerTurn();
    } else {
      $("result").style.display = "none";
      $("playing-panel").style.display = "";
      $("show-btn").style.display = "";
      $("again-btn").style.display = "none";
      const starter = players[Math.floor(Math.random() * players.length)];
      document.querySelector("#playing-panel p").textContent = starter + " fängt an! Redet miteinander und findet heraus, wer der Imposter ist.";
      show("playing");
    }
  };

  // ---- Spiel läuft ----
  $("show-btn").onclick = () => {
    const names = [...state.imposters].sort((a, b) => a - b).map(i => players[i]);
    $("result-label").textContent = names.length > 1 ? "Die Imposter sind" : "Der Imposter ist";
    $("result-names").textContent = names.join(" & ");
    $("result-word").textContent = state.word;
    $("playing-panel").style.display = "none";
    $("result").style.display = "";
    $("show-btn").style.display = "none";
    $("again-btn").style.display = "";
  };

  $("again-btn").onclick = startGame;

  $("end-btn").onclick = () => {
    state = null;
    show("setup");
  };

  // ---- Start ----
  fillCategories();
  renderPlayers();
</script>
</body>
</html>
